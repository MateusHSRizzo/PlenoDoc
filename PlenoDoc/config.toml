[server]
maxUploadSize      = 200
enableCORS         = false
enableXsrfProtection = true
headless           = false

[browser]
gatherUsageStats = false

[theme]
base            = "light"
primaryColor    = "#1f77b4"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f0f2f6"
textColor       = "#262730"

[logger]
level = "info"
